<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Gombey AI founding customer launch pricing</title>
  <desc id="desc">Gombey AI Pilot launch price of one thousand dollars for thirty days, compared with the standard website price of two thousand five hundred dollars setup plus two hundred ninety-nine dollars per month. Dedicated, private AI buildout, and enterprise offers are also shown.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#121216"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e4c0"/>
      <stop offset="1" stop-color="#c5b487"/>
    </linearGradient>
    <linearGradient id="pilot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24221d"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#d4c5a0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d4c5a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <ellipse cx="820" cy="0" rx="720" ry="430" fill="url(#glow)"/>

  <image x="88" y="48" width="198" height="130" preserveAspectRatio="xMidYMid meet" xlink:href="gombey-ai-logo.png"/>

  <rect x="1190" y="72" width="322" height="42" rx="21" fill="#d4c5a0" fill-opacity="0.12" stroke="#d4c5a0" stroke-opacity="0.55"/>
  <text x="1351" y="99" fill="#e8dbb7" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">FOUNDING CUSTOMER LAUNCH</text>

  <text x="90" y="272" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">Launch Gombey AI</text>
  <text x="90" y="344" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">with one workflow.</text>
  <text x="90" y="390" fill="#a9a7a1" font-family="Arial, Helvetica, sans-serif" font-size="20">A limited first-customer offer for teams that want a clearer,</text>
  <text x="90" y="420" fill="#a9a7a1" font-family="Arial, Helvetica, sans-serif" font-size="20">customer-controlled way to use AI.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="474" width="700" height="410" rx="24" fill="url(#pilot)" stroke="#d4c5a0" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="120" y="506" width="176" height="32" rx="16" fill="#d4c5a0"/>
    <text x="208" y="528" fill="#111114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">BEST FIRST STEP</text>

    <text x="120" y="594" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Gombey AI Pilot</text>
    <text x="120" y="631" fill="#a9a7a1" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="1">LAUNCH PRICE</text>
    <text x="120" y="696" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">$1,000</text>
    <text x="365" y="692" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">for 30 days</text>

    <text x="120" y="734" fill="#77756f" font-family="Arial, Helvetica, sans-serif" font-size="15">Website price: $2,500 setup + $299/month</text>
    <line x1="120" y1="727" x2="480" y2="727" stroke="#77756f" stroke-opacity="0.65"/>

    <circle cx="128" cy="779" r="5" fill="#d4c5a0"/>
    <text x="146" y="785" fill="#d8d4ca" font-family="Arial, Helvetica, sans-serif" font-size="17">One workflow · up to 3 users</text>
    <circle cx="128" cy="817" r="5" fill="#d4c5a0"/>
    <text x="146" y="823" fill="#d8d4ca" font-family="Arial, Helvetica, sans-serif" font-size="17">One knowledge source · acceptance test</text>
    <circle cx="128" cy="855" r="5" fill="#d4c5a0"/>
    <text x="146" y="861" fill="#d8d4ca" font-family="Arial, Helvetica, sans-serif" font-size="17">Hardware and model usage separate</text>
  </g>

  <g>
    <rect x="840" y="474" width="670" height="116" rx="20" fill="#17171a" stroke="#343338"/>
    <text x="875" y="512" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2">DEDICATED</text>
    <text x="875" y="555" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">$6,000 setup + $799/mo</text>
    <text x="1468" y="555" fill="#8e8b84" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end">standard offer</text>

    <rect x="840" y="620" width="670" height="116" rx="20" fill="#17171a" stroke="#343338"/>
    <text x="875" y="658" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2">PRIVATE AI BUILDOUT</text>
    <text x="875" y="701" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">From $3,500 + hardware</text>
    <text x="1468" y="701" fill="#8e8b84" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end">Mac · DGX · Strix</text>

    <rect x="840" y="766" width="670" height="118" rx="20" fill="#17171a" stroke="#343338"/>
    <text x="875" y="804" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2">ENTERPRISE</text>
    <text x="875" y="847" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Custom scope and support</text>
    <text x="1468" y="847" fill="#8e8b84" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="end">talk to us</text>
  </g>

  <line x1="90" y1="930" x2="1510" y2="930" stroke="#343338"/>
  <text x="90" y="962" fill="#8e8b84" font-family="Arial, Helvetica, sans-serif" font-size="14">Launch pricing applies to the pilot only · First 3 customers · No annual commitment</text>
  <text x="1510" y="962" fill="#8e8b84" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="end">Hardware, licenses, and API/model usage separate</text>
</svg>
