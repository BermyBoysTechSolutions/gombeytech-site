<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc">
  <title id="title">Gombey AI founding customer launch pricing, portrait format</title>
  <desc id="desc">Gombey AI Pilot launch price of one thousand dollars for thirty days, compared with the standard website price of two thousand five hundred dollars setup plus two hundred ninety-nine dollars per month. Dedicated, private AI buildout, and enterprise offers are also shown.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#121216"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e4c0"/>
      <stop offset="1" stop-color="#c5b487"/>
    </linearGradient>
    <linearGradient id="pilot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24221d"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#d4c5a0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d4c5a0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1080" height="1600" fill="url(#background)"/>
  <rect width="1080" height="1600" fill="url(#grid)"/>
  <ellipse cx="540" cy="0" rx="500" ry="520" fill="url(#glow)"/>

  <image x="62" y="42" width="225" height="148" preserveAspectRatio="xMidYMid meet" xlink:href="gombey-ai-logo.png"/>

  <rect x="62" y="224" width="390" height="42" rx="21" fill="#d4c5a0" fill-opacity="0.12" stroke="#d4c5a0" stroke-opacity="0.55"/>
  <text x="257" y="251" fill="#e8dbb7" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.7" text-anchor="middle">FOUNDING CUSTOMER LAUNCH</text>

  <text x="62" y="350" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">Launch Gombey AI</text>
  <text x="62" y="414" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">with one workflow.</text>
  <text x="62" y="468" fill="#a9a7a1" font-family="Arial, Helvetica, sans-serif" font-size="19">A limited first-customer offer for teams</text>
  <text x="62" y="498" fill="#a9a7a1" font-family="Arial, Helvetica, sans-serif" font-size="19">that want a customer-controlled way to use AI.</text>

  <g filter="url(#shadow)">
    <rect x="62" y="558" width="956" height="420" rx="24" fill="url(#pilot)" stroke="#d4c5a0" stroke-opacity="0.8" stroke-width="2"/>
    <rect x="98" y="594" width="176" height="32" rx="16" fill="#d4c5a0"/>
    <text x="186" y="616" fill="#111114" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">BEST FIRST STEP</text>

    <text x="98" y="687" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Gombey AI Pilot</text>
    <text x="98" y="724" fill="#a9a7a1" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1">LAUNCH PRICE</text>
    <text x="98" y="794" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="800">$1,000</text>
    <text x="345" y="790" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">for 30 days</text>

    <text x="98" y="833" fill="#77756f" font-family="Arial, Helvetica, sans-serif" font-size="15">Website price: $2,500 setup + $299/month</text>
    <line x1="98" y1="826" x2="458" y2="826" stroke="#77756f" stroke-opacity="0.65"/>

    <circle cx="106" cy="878" r="5" fill="#d4c5a0"/>
    <text x="124" y="884" fill="#d8d4ca" font-family="Arial, Helvetica, sans-serif" font-size="17">One workflow · up to 3 users</text>
    <circle cx="106" cy="916" r="5" fill="#d4c5a0"/>
    <text x="124" y="922" fill="#d8d4ca" font-family="Arial, Helvetica, sans-serif" font-size="17">One knowledge source · acceptance test</text>
    <circle cx="106" cy="954" r="5" fill="#d4c5a0"/>
    <text x="124" y="960" fill="#d8d4ca" font-family="Arial, Helvetica, sans-serif" font-size="17">Hardware and model usage separate</text>
  </g>

  <rect x="62" y="1012" width="956" height="132" rx="20" fill="#17171a" stroke="#343338"/>
  <text x="98" y="1053" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2">DEDICATED</text>
  <text x="98" y="1100" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">$6,000 setup + $799/mo</text>

  <rect x="62" y="1170" width="956" height="132" rx="20" fill="#17171a" stroke="#343338"/>
  <text x="98" y="1211" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2">PRIVATE AI BUILDOUT</text>
  <text x="98" y="1258" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">From $3,500 + hardware</text>

  <rect x="62" y="1328" width="956" height="132" rx="20" fill="#17171a" stroke="#343338"/>
  <text x="98" y="1369" fill="#d4c5a0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" letter-spacing="2">ENTERPRISE</text>
  <text x="98" y="1416" fill="#f7f3ea" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Custom scope and support</text>

  <line x1="62" y1="1510" x2="1018" y2="1510" stroke="#343338"/>
  <text x="62" y="1542" fill="#8e8b84" font-family="Arial, Helvetica, sans-serif" font-size="14">Launch pricing applies to the pilot only · First 3 customers</text>
  <text x="62" y="1570" fill="#8e8b84" font-family="Arial, Helvetica, sans-serif" font-size="14">Hardware, licenses, and API/model usage are separate.</text>
</svg>
